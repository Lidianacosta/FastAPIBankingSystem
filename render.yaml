services:
  - type: web
    name: fastapibanksystem
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fastapibank-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FIRST_SUPERUSER_USERNAME
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: fastapibank-db
    plan: free
    region: oregon
