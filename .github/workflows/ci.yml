name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install uv
        uses: astral-sh/setup-uv@857947113170757f49551c65d6484e5088f117c0 # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@f6742a91b3c2a4176985474360e200155b9e0f6b # v5.1.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy .

      - name: Run tests with Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_db
        run: uv run pytest tests/
